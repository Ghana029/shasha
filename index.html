        <div class="hamburger" id="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <h1 class="logo"><a href="#" onclick="showTopPage(); return false;"><p>ぎょうぶの戯言</p></a></h1>
            <nav>
                <ul class="nav-links">
                    <li>
                        <span class="nav-category">写真</span>
                        <ul class="sub-nav">
                            <li><a href="#" onclick="loadSection('umi.html'); return false;">うみ</a></li>
                            <li><a href="#" onclick="loadSection('kk.html'); return false;">おめでとー</a></li>
                            <li><a href="#" onclick="loadSection('kk.html'); return false;">ながとろ</a></li>

                        </ul>

                    <!-- 「なんかひとりごと」の項目は削除しました -->
                </ul>
            </nav>
        </aside>

        <main class="content">
            <div id="loading" style="display: none;">読み込み中...</div>
            
            <div id="dynamic-content" class="content-section">
                <div id="content-grid">
                    <div class="top-main-visual">
                        <img src="images/top.jpg" alt="Top Image">
                    </div>
                </div>
            </div>
            
        </main>

    <!-- モーダル部分 -->
    <div id="photo-modal" class="modal" onclick="closeModal(event)">
        <span class="close-btn" onclick="closeModal(event, true)">&times;</span>
        
        <div class="modal-content">
            <img id="modal-img" src="" alt="">
            
            <div class="modal-nav">
                <span class="nav-btn prev" onclick="changePhoto(-1, event)">←</span>
                <span class="nav-btn next" onclick="changePhoto(1, event)">→</span>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
